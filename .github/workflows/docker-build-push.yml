name: Build, Push, and Deploy Docker Image

on:
  push:
    branches:
      - week02

jobs:
  build:
    name: Build and Push to Docker Hub
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/cs6620-app:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/cs6620-app:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.event.repository.html_url }}
            org.opencontainers.image.revision=${{ github.sha }}
            build.source=github-actions
            build.workflow=${{ github.workflow }}
            build.run_id=${{ github.run_id }}
            build.run_number=${{ github.run_number }}

  deploy:
    name: Deploy to EC2 via SSM
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy using SSM Run Command
        run: |
          IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/cs6620-app:latest"
          SHA="${{ github.sha }}"

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Install Docker (if needed) and deploy container via GitHub Actions + AWS SSM" \
            --parameters commands="[
              \"set -e\",
              \"echo '=== Who am I ==='\",
              \"whoami\",
              \"echo '=== Check Docker ==='\",
              \"if ! command -v docker >/dev/null 2>&1; then \",
              \"  echo 'Docker not found. Installing...'; \",
              \"  if command -v yum >/dev/null 2>&1; then \",
              \"    sudo yum update -y || true; \",
              \"    sudo yum install -y docker; \",
              \"  elif command -v apt-get >/dev/null 2>&1; then \",
              \"    sudo apt-get update -y; \",
              \"    sudo apt-get install -y docker.io; \",
              \"  else \",
              \"    echo 'No supported package manager (yum/apt-get).'; exit 1; \",
              \"  fi; \",
              \"fi\",
              \"echo '=== Start Docker service ==='\",
              \"sudo systemctl start docker || true\",
              \"sudo systemctl enable docker || true\",
              \"sudo docker --version\",
              \"echo '=== Pull image ==='\",
              \"sudo docker pull ${IMAGE}\",
              \"echo '=== Stop old container (if any) ==='\",
              \"sudo docker stop cs6620-app || true\",
              \"sudo docker rm cs6620-app || true\",
              \"echo '=== Run new container ==='\",
              \"sudo docker run -d -p 80:5000 --restart unless-stopped --name cs6620-app -e GITHUB_SHA=${SHA} ${IMAGE}\",
              \"echo '=== Running containers ==='\",
              \"sudo docker ps --format '{{.Names}}\\t{{.Status}}\\t{{.CreatedAt}}'\",
              \"echo '=== Image labels (proof) ==='\",
              \"sudo docker image inspect ${IMAGE} --format='{{json .Config.Labels}}' | python3 -m json.tool || true\"
            ]" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: ${COMMAND_ID}"

      - name: Print deploy info
        run: |
          echo "Deploy command submitted to SSM for instance ${{ secrets.EC2_INSTANCE_ID }} in region ${{ secrets.AWS_REGION }}"
